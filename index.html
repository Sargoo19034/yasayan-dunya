<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>🌍 Yeni Dünya Düzeni</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#07111c;
  color:white;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

h1{
  margin:0 0 6px;
  font-size:32px;
}

.subtitle{
  color:#8fa6ba;
  margin-bottom:20px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.stat{
  background:#0d1d2b;
  border:1px solid #173149;
  border-radius:15px;
  padding:16px;
}

.stat small{
  display:block;
  color:#8fa6ba;
  margin-bottom:7px;
}

.stat strong{
  font-size:25px;
}

.controls{
  display:flex;
  gap:10px;
  margin:20px 0;
}

.controls button{
  flex:1;
  border:0;
  border-radius:13px;
  padding:15px 8px;
  background:#3275bd;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.panel{
  background:#0b1926;
  border:1px solid #173149;
  border-radius:17px;
  padding:16px;
  margin-bottom:20px;
}

.panel h2{
  margin-top:0;
}

.person{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  text-align:left;
  border:1px solid #173149;
  background:#0d1d2b;
  color:white;
  border-radius:12px;
  padding:14px;
  margin-bottom:8px;
}

.person small{
  display:block;
  color:#8fa6ba;
  margin-top:4px;
}

.person strong{
  color:#5ee58a;
}

.bio{
  line-height:1.8;
}

.bio button{
  border:0;
  border-radius:6px;
  padding:4px 8px;
  background:#173149;
  color:#70c5ff;
}

.event{
  background:#0d1d2b;
  border-left:3px solid #3989d6;
  border-radius:8px;
  padding:10px;
  margin-bottom:7px;
}

.bar{
  height:10px;
  background:#152533;
  border-radius:20px;
  overflow:hidden;
  margin-top:15px;
}

.bar span{
  display:block;
  height:100%;
  background:#35c878;
}
</style>
</head>

<body>

<div class="container">

<h1>🌍 Yeni Dünya Düzeni</h1>

<div class="subtitle">
Biyoloji + insan yaşamı + medeniyet simülasyonu
</div>


<div class="stats">

<div class="stat">
<small>Yıl</small>
<strong id="year">2026</strong>
</div>

<div class="stat">
<small>Nüfus</small>
<strong id="population">0</strong>
</div>

<div class="stat">
<small>Genetik</small>
<strong id="genetic">0 birey</strong>
</div>

<div class="stat">
<small>Ortalama Enerji</small>
<strong id="energy">0%</strong>
</div>

<div class="stat">
<small>Biyosfer</small>
<strong id="biosphere">100%</strong>
</div>

</div>


<div class="controls">

<button onclick="advance(1)">
+1 yıl
</button>

<button onclick="advance(10)">
+10 yıl
</button>

<button onclick="advance(100)">
+100 yıl
</button>

</div>


<div class="panel">

<h2>👥 İnsanlar</h2>

<div id="people"></div>

</div>


<div class="panel">

<h2>🧬 Birey Profili</h2>

<div id="profile">
Bir kişiye tıklayın.
</div>

</div>


<div class="panel">

<h2>🌎 Dünya Olayları</h2>

<div id="events"></div>

</div>

</div>


<script>

/* =========================
   İSİMLER
========================= */

const names=[
"Deniz",
"Duru",
"Mert",
"Zeynep",
"Emir",
"Ada",
"Efe",
"Elif",
"Aras",
"Mina"
];

const jobs=[
"Mühendis",
"Doktor",
"Öğretmen",
"Müzisyen",
"Çiftçi",
"Yazılımcı",
"Tasarımcı",
"Esnaf"
];


/* =========================
   RASTGELE
========================= */

function random(min,max){
return Math.random()*(max-min)+min;
}


/* =========================
   KİŞİ
========================= */

function createPerson(i){

return{

id:i+1,

name:names[i],

sex:i<5?"Erkek":"Kadın",

age:Math.floor(random(20,38)),

job:jobs[i%jobs.length],

health:100,

energy:Math.floor(random(70,100)),

hunger:Math.floor(random(5,20)),

water:Math.floor(random(5,20)),

money:Math.floor(random(500,2500)),

alive:true,

mother:null,

father:null,

partner:null,

children:[],

generation:0,

dna:{
eye:["kahverengi","ela","mavi"][i%3],
hair:["siyah","kahverengi","kumral"][i%3],
resilience:Math.floor(random(70,100)),
metabolism:Math.floor(random(80,120))
}

};

}


/* =========================
   DÜNYA
========================= */

let world={

year:2026,

biosphere:100,

people:[],

events:[]

};


/* =========================
   İLK 10 İNSAN
========================= */

for(let i=0;i<10;i++){

world.people.push(
createPerson(i)
);

}


/* =========================
   KAYDET
========================= */

function save(){

localStorage.setItem(
"yeniDunya",
JSON.stringify(world)
);

}


/* =========================
   YÜKLE
========================= */

function load(){

const data=
localStorage.getItem("yeniDunya");

if(!data){
return;
}

try{

world=
JSON.parse(data);

}catch(e){

console.log(e);

}

}


/* =========================
   OLAY
========================= */

function addEvent(text){

world.events.unshift(
world.year+": "+text
);

if(world.events.length>50){

world.events=
world.events.slice(0,50);

}

}


/* =========================
   PROFİL
========================= */

function showPerson(id){

const p=
world.people.find(
x=>x.id===id
);

if(!p){
return;
}

document.getElementById(
"profile"
).innerHTML=`

<div class="bio">

<h3>🧬 ${p.name}</h3>

<strong>
${p.age} yaş ·
${p.sex} ·
${p.job}
</strong>

<br><br>

❤️ Sağlık:
${Math.round(p.health)}%

<br>

⚡ Enerji:
${Math.round(p.energy)}%

<br>

💧 Su:
${Math.round(p.water)}%

<br>

🍽️ Açlık:
${Math.round(p.hunger)}%

<br>

💰 Para:
${Math.round(p.money)} TL

<hr>

👁️ Göz:
${p.dna.eye}

<br>

💇 Saç:
${p.dna.hair}

<br>

🛡️ Dayanıklılık:
${p.dna.resilience}

<br>

🧪 Metabolizma:
${p.dna.metabolism}

<hr>

👩 Anne:
${
p.mother
?
getName(p.mother)
:
"—"
}

<br>

👨 Baba:
${
p.father
?
getName(p.father)
:
"—"
}

<br>

❤️ Eş:
${
p.partner
?
getName(p.partner)
:
"—"
}

<br>

🧬 Nesil:
${p.generation}

<br>

👶 Çocuk sayısı:
${p.children.length}

<div class="bar">

<span style="
width:${Math.max(
0,
Math.min(100,p.health)
)}%
"></span>

</div>

</div>

`;

}


/* =========================
   İSİM BUL
========================= */

function getName(id){

const p=
world.people.find(
x=>x.id===id
);

return p
? p.name
: "Bilinmiyor";

}

/* =========================
   İLİŞKİ SİSTEMİ
========================= */

function tryPair(){

  const adults=world.people.filter(p=>
    p.alive &&
    p.age>=18 &&
    !p.partner
  );

  const males=adults.filter(
    p=>p.sex==="Erkek"
  );

  const females=adults.filter(
    p=>p.sex==="Kadın"
  );

  if(!males.length || !females.length){
    return;
  }

  if(Math.random()>0.25){
    return;
  }

  const male=
    males[Math.floor(Math.random()*males.length)];

  const female=
    females[Math.floor(Math.random()*females.length)];

  male.partner=female.id;
  female.partner=male.id;

  addEvent(
    `❤️ ${male.name} ve ${female.name} bir çift oldu.`
  );
}


/* =========================
   DOĞUM SİSTEMİ
========================= */

function tryBirth(){

  const mothers=world.people.filter(p=>
    p.alive &&
    p.sex==="Kadın" &&
    p.age>=20 &&
    p.age<=40 &&
    p.partner
  );

  if(!mothers.length){
    return;
  }

  if(Math.random()>0.12){
    return;
  }

  const mother=
    mothers[Math.floor(Math.random()*mothers.length)];

  const father=
    world.people.find(
      p=>p.id===mother.partner
    );

  if(!father || !father.alive){
    return;
  }

  const babyNames=[
    "Can","Kerem","Kaan","Bora",
    "Alp","Derin","Lina","Ece",
    "Naz","Mira","Deniz","Aras"
  ];

  const newId=
    Math.max(
      ...world.people.map(p=>p.id)
    )+1;

  const baby={

    id:newId,

    name:
      babyNames[
        Math.floor(
          Math.random()*babyNames.length
        )
      ],

    sex:
      Math.random()<0.5
      ?"Erkek"
      :"Kadın",

    age:0,

    job:"Çocuk",

    health:100,

    energy:95,

    hunger:5,

    water:5,

    money:0,

    alive:true,

    mother:mother.id,

    father:father.id,

    partner:null,

    children:[],

    generation:
      Math.max(
        mother.generation,
        father.generation
      )+1,

    dna:{

      eye:
        Math.random()<0.5
        ?mother.dna.eye
        :father.dna.eye,

      hair:
        Math.random()<0.5
        ?mother.dna.hair
        :father.dna.hair,

      resilience:
        Math.round(
          (
            mother.dna.resilience+
            father.dna.resilience
          )/2+
          random(-5,5)
        ),

      metabolism:
        Math.round(
          (
            mother.dna.metabolism+
            father.dna.metabolism
          )/2+
          random(-5,5)
        )

    }

  };

  world.people.push(baby);

  mother.children.push(baby.id);

  father.children.push(baby.id);

  addEvent(
    `👶 ${mother.name} ve ${father.name} çocuk sahibi oldu: ${baby.name}.`
  );

}
/* =========================
   RENDER
========================= */

function render(){

const alive=
world.people.filter(
p=>p.alive
);


document.getElementById(
"year"
).textContent=
world.year;


document.getElementById(
"population"
).textContent=
alive.length;


document.getElementById(
"genetic"
).textContent=
alive.length+
" birey";


let average=0;

if(alive.length){

average=
alive.reduce(
(sum,p)=>sum+p.energy,
0
)/alive.length;

}

document.getElementById(
"energy"
).textContent=
Math.round(average)+"%";


document.getElementById(
"biosphere"
).textContent=
Math.round(
world.biosphere
)+"%";


document.getElementById(
"people"
).innerHTML=
alive.map(p=>`

<button
class="person"
onclick="showPerson(${p.id})"
>

<span>

👤 ${p.name}

<small>
${p.age} yaş · ${p.job}
</small>

</span>

<strong>
${Math.round(p.health)}%
</strong>

</button>

`).join("");


document.getElementById(
"events"
).innerHTML=
world.events.length
?
world.events.map(e=>`
<div class="event">
${e}
</div>
`).join("")
:
`<div class="event">
🌍 Dünya henüz yeni oluştu.
</div>`;


}


/* =========================
   ZAMAN
========================= */

function advance(years){

for(
let i=0;
i<years;
i++
){

world.year++;


/* BİREYLER */

world.people
.filter(p=>p.alive)
.forEach(p=>{

p.age++;

p.hunger=
Math.min(
100,
p.hunger+
random(5,12)
);

p.water=
Math.min(
100,
p.water+
random(4,10)
);

p.energy=
Math.max(
0,
p.energy-
random(1,5)
);

if(
p.hunger>80 ||
p.water>85
){

p.health-=
random(1,3);

}else{

p.health+=
random(.1,.5);

}

p.health=
Math.max(
0,
Math.min(
100,
p.health
)
);


/* PARA */

if(p.age>=18){

p.money+=
Math.floor(
random(300,1000)
);

}


/* ÖLÜM */

if(
p.age>90 ||
p.health<=0
){

p.alive=false;

addEvent(
"☠️ "+p.name+
" hayatını kaybetti."
);

}

});


/* BİYOSFER */

world.biosphere+=
random(-.2,.2);

world.biosphere=
Math.max(
0,
Math.min(
100,
world.biosphere
)
);
tryPair();
tryBirth();
}


/* OLAY */

addEvent(
"⏩ Zaman "+
years+
" yıl ilerledi."
);


/* GÜNCELLE */

render();


/* KAYDET */

save();

}


/* =========================
   BAŞLAT
========================= */

load();

render();

</script>

</body>
</html>
